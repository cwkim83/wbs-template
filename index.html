<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>WBS 일정표 템플릿</title>
<!-- WBS 일정표 템플릿 · © 2026 crazy4eu (cwkim83) · 라이선스는 LICENSE 파일 참고 -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;padding:0}
#app{position:relative;height:100vh;min-height:600px;overflow:hidden;display:flex;background:#f0f4f8;font-family:'Segoe UI',Arial,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#c4cdd8;border-radius:3px}
.sb{height:100%;background:#fff;border-right:1px solid #e4e7ec;display:flex;flex-direction:column;overflow:hidden;transition:width .25s;flex-shrink:0}
.nav-b{display:flex;align-items:center;gap:7px;width:100%;padding:8px 12px;background:transparent;color:#4b5563;border:none;cursor:pointer;border-radius:6px;font-size:11px;text-align:left;transition:background .1s}
.nav-b:hover{background:#f0f4f9}.nav-b.on{background:#eef3fb;color:#4a7fc1;font-weight:700;border-left:3px solid #4a7fc1;padding-left:9px}
.ti{display:flex;align-items:center;gap:5px;padding:4px 10px;cursor:pointer;border-radius:5px;margin:1px 4px;font-size:10px;color:#4b5563;white-space:nowrap;overflow:hidden;transition:background .1s}
.ti:hover{background:#f0f4f9}.ti.on{background:#eef3fb;color:#4a7fc1;font-weight:600}
.sb-tree{flex:1;overflow-y:auto;padding:0 4px;min-height:0}
.tgl{position:absolute;top:50%;transform:translateY(-50%);width:15px;height:42px;background:#4a7fc1;color:#fff;border:none;border-radius:0 5px 5px 0;cursor:pointer;font-size:10px;z-index:20;transition:left .25s}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.thdr{background:#fff;border-bottom:1px solid #e4e7ec;min-height:52px;display:flex;align-items:center;flex-wrap:wrap;padding:6px 14px;gap:6px 8px;flex-shrink:0}
.htitle{font-size:13px;font-weight:700;color:#1a2332;margin-right:auto}
.vb{padding:4px 9px;border-radius:5px;border:1px solid #e4e7ec;background:#fff;color:#6b7280;font-size:11px;cursor:pointer}
.vb.on{background:#4a7fc1;color:#fff;border-color:#4a7fc1}
.addb{padding:4px 11px;background:#4a7fc1;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;font-weight:600}
.fbar{background:#fff;border-bottom:1px solid #e4e7ec;padding:5px 14px;display:flex;gap:4px;align-items:center;flex-shrink:0}
.fb{padding:3px 8px;border-radius:5px;border:1px solid #e4e7ec;background:#fff;color:#6b7280;font-size:10px;cursor:pointer}
.fb.on{background:#4a7fc1;color:#fff;border-color:#4a7fc1;font-weight:700}
.cont{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:7px}
.pg{padding:14px;overflow-y:auto;flex:1}
table{width:100%;border-collapse:collapse}
th{padding:7px 8px;font-size:10px;font-weight:700;color:#6b7280;text-align:left;border-bottom:1px solid #e4e7ec;background:#f8fafc;white-space:nowrap;position:sticky;top:0;z-index:5}
td{padding:0 6px;border-bottom:1px solid #f0f4f8;font-size:11px;height:30px}
tr:hover td{background:#f9fafb}
tr.sel td{background:#dbeafe!important;box-shadow:inset 0 -1px 0 #93c5fd,inset 0 1px 0 #93c5fd}tr.sel td:first-child{box-shadow:inset 4px 0 0 #2563eb,inset 0 -1px 0 #93c5fd,inset 0 1px 0 #93c5fd}tr.sel td .cell-inner{font-weight:700}
.crd{background:#fff;border-radius:8px;padding:14px;margin-bottom:8px;border:1px solid #e4e7ec;cursor:pointer;transition:box-shadow .12s}
.crd:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bdg{display:inline-flex;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:700}
.ptb{display:inline-flex;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:800;border:1px solid}
.prg{display:flex;align-items:center;gap:5px}
.pb{flex:1;height:5px;border-radius:3px;background:#e4e7ec;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .4s}
.pv{font-size:10px;color:#6b7280;min-width:24px;text-align:right}
.ir{padding:7px 11px;border-bottom:1px solid #f0f4f8;cursor:pointer;border-left:3px solid transparent}
.ir:hover{background:#f9fafb}.ir.sel{background:#dbeafe;border-left-color:#2563eb;border-left-width:4px;font-weight:700}
.split-w{display:flex;flex:1;overflow:hidden}
/* v29.9: 옛 3분할 뷰 클래스 (.tpn/.gpn/.spn) 는 어디에서도 사용 안 됨 — 통합 테이블로 대체됨. 제거. */
.mrow{display:flex;background:#f8fafc;border-bottom:1px solid #e4e7ec;position:sticky;top:0;z-index:5}
.mcl{flex:1;padding:6px 0;text-align:center;font-size:9px;font-weight:600;color:#6b7280;border-left:1px solid #e4e7ec;min-width:30px}
.mcl:first-child{border-left:none}
.dpnl{flex-shrink:0;background:#fff;border:1.5px solid #c3d6f0;border-radius:10px;padding:10px 16px;margin-top:6px;max-height:34vh;overflow-y:auto}
.dpnl-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dpnl-code{font-size:11px;font-weight:700;color:#4a7fc1;background:#eef3fb;padding:2px 8px;border-radius:4px;margin-right:8px}
.dpnl-name{font-size:14px;font-weight:700;color:#1a2332}
.dpnl-actions{display:flex;gap:6px;align-items:center}
.edit-btn{padding:4px 12px;background:#4a7fc1;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;font-weight:600}
.edit-btn:hover{background:#3a6bb5}
.close-btn{width:24px;height:24px;background:none;border:none;cursor:pointer;color:#9ca3af;font-size:16px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.close-btn:hover{background:#f0f4f8;color:#4b5563}
.dpnl-fields{display:flex;gap:8px}
.dpnl-field{flex:1;background:#f8fafc;border-radius:6px;border:1px solid #e4e7ec;padding:7px 10px;min-width:80px}
.dpnl-field-lbl{font-size:10px;color:#9ca3af;margin-bottom:3px}
.dpnl-field-val{font-size:12px;font-weight:700;color:#1a2332}
.dpnl-input{width:100%;background:#fff;border:1px solid #c3d6f0;border-radius:4px;padding:3px 6px;font-size:11px;font-weight:600;color:#1a2332;outline:none}
.dpnl-input:focus{border-color:#4a7fc1}
.dpnl-select{width:100%;background:#fff;border:1px solid #c3d6f0;border-radius:4px;padding:3px 4px;font-size:11px;font-weight:600;color:#1a2332;outline:none;cursor:pointer}
.save-btn{padding:4px 12px;background:#16a34a;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;font-weight:600}
.save-btn:hover{background:#15803d}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.mdl{background:#fff;border-radius:10px;padding:18px;width:400px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.fl{font-size:11px;color:#6b7280;margin-bottom:2px}
.fi{width:100%;padding:5px 7px;border:1px solid #e4e7ec;border-radius:5px;font-size:11px;outline:none;font-family:inherit}
.fi:focus{border-color:#4a7fc1}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#16a34a;margin-right:3px;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bc-b{color:#4a7fc1;background:none;border:none;cursor:pointer;font-size:11px;padding:0}
.sb-log{padding:8px 10px;border-top:1px solid #e4e7ec;background:#f8fafc;flex-shrink:0}
.sb-log-item{font-size:9px;padding:2px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
/* ─── v28.0 패치 전용 클래스 (원본 UI 보존, 추가만) ─── */
.v28-eb{padding:3px 9px;border-radius:5px;border:1px solid #e4e7ec;background:#fff;color:#4a7fc1;font-size:10px;cursor:pointer;font-weight:600;margin-left:4px}
.v28-eb:hover{background:#eef3fb}
.v28-cal-wrap{display:flex;flex:1;overflow:hidden}
.v28-cal-left{flex-shrink:0;background:#fff;position:sticky;left:0;z-index:6;border-right:2px solid #e4e7ec;box-shadow:2px 0 4px -2px rgba(0,0,0,.05)}
.v28-cal-scroll{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.v28-cal-right{flex-shrink:0;background:#fff;position:sticky;right:0;z-index:6;border-left:2px solid #e4e7ec;box-shadow:-2px 0 4px -2px rgba(0,0,0,.05);width:46px}
.v28-mhdr{display:flex;background:#f8fafc;border-bottom:1px solid #e4e7ec;min-width:max-content;height:29px}
.v28-mcl{flex-shrink:0;height:28px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:600;color:#6b7280;border-left:1px solid #e4e7ec;white-space:nowrap}
.v28-mcl:first-child{border-left:none}
.v28-mcl-year{background:#eef3fb;color:#4a7fc1;font-weight:700}
.v28-bar-outer{position:absolute;height:100%;background:#e5e7eb;border-radius:3px;overflow:hidden}
.v28-bar-fill{height:100%;background:#16a34a;transition:width .4s}
.v28-bar-label{position:absolute;left:0;right:0;text-align:center;font-size:9px;color:#1a2332;font-weight:700;white-space:nowrap;z-index:2;pointer-events:none;line-height:20px}
/* v30: 간트 메모 콜아웃 — 막대 클릭 시 말풍선, 우클릭으로 작성 */
.v28-bar-outer.has-memo{cursor:pointer}
.v28-bar-outer.has-memo:hover{filter:brightness(1.07);box-shadow:0 0 0 2px rgba(220,38,38,.25)}
.v28-memo-dot{position:absolute;top:-4px;width:13px;height:13px;background:#dc2626;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;z-index:6;box-shadow:0 1px 3px rgba(0,0,0,.25);transform:translateX(-50%);cursor:grab}
.v28-memo-dot:hover{box-shadow:0 0 0 3px rgba(220,38,38,.25),0 1px 3px rgba(0,0,0,.25)}
.v28-memo-dot:active{cursor:grabbing}
.v28-memo-line{position:absolute;z-index:5;pointer-events:none;overflow:visible}
.v28-memo-co{position:absolute;width:200px;background:#fff;border:1.5px solid #dc2626;border-radius:7px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:5;font-size:10.5px;cursor:default;animation:v28memopop .15s ease-out}
@keyframes v28memopop{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.v28-memo-co .co-hd{display:flex;align-items:center;gap:4px;padding:4px 7px;background:#fef2f2;border-bottom:1px solid #fecaca;border-radius:6px 6px 0 0;font-weight:800;color:#b91c1c;font-size:10px;cursor:move;user-select:none}
.v28-memo-co.dragging{opacity:.85;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.v28-memo-co .co-hd .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v28-memo-co .co-hd button{border:none;background:#fee2e2;color:#dc2626;border-radius:3px;cursor:pointer;font-size:9px;padding:1px 5px;flex-shrink:0;line-height:1.4}
.v28-memo-co .co-hd button:hover{background:#dc2626;color:#fff}
.v28-memo-co .co-bd{padding:6px 8px;color:#1f2937;line-height:1.5;white-space:pre-wrap;word-break:break-word}
@media print{.v28-memo-co,.v28-memo-line,.v28-memo-dot{display:none!important}}
.v28-wsum{flex-shrink:0;background:#fffdf5;border:1.5px solid #f6d76a;border-radius:10px;padding:10px 14px;margin-top:6px;margin-bottom:6px}
.v28-wsum-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;border-bottom:1px solid #f0e5b8;padding-bottom:6px}
.v28-wsum-title{font-size:12px;font-weight:700;color:#92732e;display:flex;align-items:center;gap:6px}
.v28-wsum-meta{font-size:10px;color:#a08a4a}
.v28-wsum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.v28-wsum-sec{background:#fff;border-radius:6px;padding:7px 10px;border:1px solid #f0e5b8}
.v28-wsum-sec-ttl{font-size:10px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:4px}
.v28-wsum-it{font-size:10px;color:#4b5563;padding:2px 0;line-height:1.5}
.v28-wsum-list{max-height:56px;overflow-y:auto;padding-right:3px}
.v28-wsum-list::-webkit-scrollbar{width:5px}.v28-wsum-list::-webkit-scrollbar-thumb{background:#e5d98a;border-radius:3px}
.v28-wsum-em{font-size:10px;color:#9ca3af;font-style:italic}
.v28-rem{width:42px;text-align:center;padding:0;border-left:1px solid #f0f4f8}
/* ─── v28.4.17 ★ 통합 WBS Table — 사용자 발상: 하나의 table에 모든 컬럼, CSS로 보이기/숨기기 ─── */
.wbs-unified-wrap{position:relative;overflow:auto;background:#fff;border-radius:8px;border:1px solid #e4e7ec;max-height:calc(100vh - 280px)}
.wbs-unified-tbl{border-collapse:collapse!important;border-spacing:0!important;table-layout:fixed}
.wbs-unified-tbl thead th{height:30px;padding:0 8px;font-size:10px;font-weight:700;color:#6b7280;background:#f8fafc;border-bottom:1px solid #e4e7ec;text-align:left;position:sticky;top:0;z-index:5;box-sizing:border-box;vertical-align:middle;white-space:nowrap}
.wbs-unified-tbl thead th.col-gantt{padding:0;overflow:visible;position:relative}
.col-rsz{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:7;user-select:none}
.col-rsz:hover,.col-rsz.on{background:rgba(37,99,235,.3)}
@keyframes genspin{to{transform:rotate(360deg)}}
.wbs-unified-tbl thead th.col-gantt>div>div{flex:1;padding:0 4px;font-size:9px;color:#6b7280;display:flex;align-items:center;justify-content:center;height:30px;border-left:1px solid #eef0f3;box-sizing:border-box;white-space:nowrap}
.wbs-unified-tbl tbody tr{cursor:pointer;height:31px;box-sizing:border-box}
.wbs-unified-tbl tbody tr.sel{background:#dbeafe!important;outline:2px solid #60a5fa;outline-offset:-2px}
.wbs-unified-tbl tbody tr:hover:not(.sel){background:#f9fafb}
.wbs-unified-tbl tbody td{height:31px;padding:0;border-bottom:1px solid #f0f4f8;font-size:11px;box-sizing:border-box;vertical-align:middle;overflow:hidden}
.wbs-unified-tbl tbody td .cell-inner{padding:0 8px;height:31px;display:flex;align-items:center;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-sizing:border-box}
.wbs-unified-tbl tbody td.col-gantt{padding:0;position:relative;overflow:visible} /* v30: 메모 콜아웃이 셀 밖으로 나올 수 있게 */
.wbs-unified-tbl tbody td.col-gantt .cell-inner{position:relative;padding:0 3px;height:31px;overflow:visible}
.wbs-unified-tbl tbody td.col-rem .cell-inner{padding:0;justify-content:center}
/* 탭별 컬럼 보이기/숨기기 */
.wbs-unified-tbl.wbs-view-split .col-mgr,
.wbs-unified-tbl.wbs-view-split .col-start,
.wbs-unified-tbl.wbs-view-split .col-end{display:none}
.wbs-unified-tbl.wbs-view-tree .col-gantt{display:none}
.wbs-unified-tbl.wbs-view-gantt .col-mgr,
.wbs-unified-tbl.wbs-view-gantt .col-start,
.wbs-unified-tbl.wbs-view-gantt .col-end,
.wbs-unified-tbl.wbs-view-gantt .col-pct,
.wbs-unified-tbl.wbs-view-gantt .col-status{display:none}
/* col-name 폭 탭별 조정 */
.wbs-unified-tbl.wbs-view-gantt col.col-name{width:280px}
.wbs-unified-tbl.wbs-view-tree col.col-name{width:280px}
/* sticky 좌측 컬럼 (간트 탭에서 작업명 고정) */
.wbs-unified-tbl.wbs-view-gantt tbody td.col-code,
.wbs-unified-tbl.wbs-view-gantt tbody td.col-name,
.wbs-unified-tbl.wbs-view-gantt thead th.col-code,
.wbs-unified-tbl.wbs-view-gantt thead th.col-name{position:sticky;background:#fff;z-index:4}
.wbs-unified-tbl.wbs-view-gantt thead th.col-code,.wbs-unified-tbl.wbs-view-gantt thead th.col-name{background:#f8fafc;z-index:6}
.wbs-unified-tbl.wbs-view-gantt tbody td.col-code,.wbs-unified-tbl.wbs-view-gantt thead th.col-code{left:0}
.wbs-unified-tbl.wbs-view-gantt tbody td.col-name,.wbs-unified-tbl.wbs-view-gantt thead th.col-name{left:50px}
.wbs-unified-tbl tbody td.col-rem{position:sticky;right:0;background:#fff;z-index:3;border-left:1px solid #e4e7ec}
.wbs-unified-tbl thead th.col-rem{position:sticky;right:0;background:#f8fafc;z-index:6;border-left:1px solid #e4e7ec}
/* ─── v28.4: 숨김 토글, 인쇄 버튼, @media print ─── */
.sb-hide-btn{margin-left:4px;padding:1px 4px;background:transparent;border:none;cursor:pointer;font-size:10px;opacity:0.4;border-radius:3px}
.sb-hide-btn:hover{opacity:1;background:#eef3fb}
.ti.hidden-proj{opacity:0.55}
.sb-show-hidden-btn{padding:1px 6px;background:#f3f4f6;color:#6b7280;border:1px solid #e4e7ec;border-radius:3px;cursor:pointer;font-size:9px;font-weight:600}
.sb-show-hidden-btn:hover{background:#e5e7eb;color:#1a2332}
.v284-hide-toggle{padding:5px 11px;background:#f3f4f6;color:#6b7280;border:1.5px solid #e4e7ec;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.v284-hide-toggle:hover{background:#e5e7eb;color:#1a2332}
.v284-hide-toggle.on{background:#fef3c7;color:#92732e;border-color:#f6d76a}
.v284-print-btn{padding:5px 11px;background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;border:1.5px solid #93c5fd;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700;margin-left:4px;display:flex;align-items:center;gap:4px}
.v284-print-btn:hover{background:linear-gradient(135deg,#bfdbfe,#93c5fd);transform:translateY(-1px);box-shadow:0 3px 8px rgba(147,197,253,.4)}

/* ─── 인쇄 전용 CSS (v28.4.2 전면 재작성) ─── */
@media print{
  @page{size:A4 landscape;margin:10mm 8mm}
  body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* 사이드바, 헤더 버튼 숨김 */
  .sb,.sb-toggle{display:none!important}
  .cont>.thdr>.bc-b,.cont>.thdr>div:nth-child(3),.cont>.thdr>.addb,.cont>.thdr>.v284-print-btn,.cont>.thdr>.v28-eb,.cont>.thdr>span{display:none!important}
  .layout{display:block!important}
  .mainx{margin-left:0!important;width:100%!important}
  .thdr{border-bottom:2px solid #000!important;padding:8px 0!important;page-break-inside:avoid}
  .htitle{font-size:14pt!important;font-weight:800!important;color:#000!important}
  /* 모달, 패널 숨김 */
  .ov,.mdl,.dpnl{display:none!important}
  .sb-log,.v28-week-panel,.v28-wsum{display:none!important}
  /* 동기화 로그도 인쇄 안 함 */
  
  /* v28.4.2: 모든 컨테이너 overflow 해제 + height 제한 해제 */
  .cont,.split-w,#v284-split-wrap,#v284-split-left,#v284-split-right,#v284-gantt-wrap{
    overflow:visible!important;
    height:auto!important;
    max-height:none!important;
    min-height:0!important;
    width:100%!important;
    display:block!important;
  }
  /* 분할 화면 좌우 모두 표시되도록 (block 대신 inline-block 또는 flex 유지) */
  #v284-split-wrap{display:flex!important;align-items:flex-start!important;page-break-inside:auto!important}
  #v284-split-left{width:30%!important;flex-shrink:0!important;display:block!important}
  #v284-split-right{flex:1!important;display:flex!important;overflow:visible!important}
  /* 간트 화면 좌우 모두 표시 */
  #v284-gantt-wrap{display:flex!important;align-items:flex-start!important;page-break-inside:auto!important}
  /* 내부 가로 스크롤 컨테이너도 모두 펼침 */

function v28CalcCal(availPx){

function childW(id){
  const i=WBS.findIndex(w=>w.id===id);
  if(i<0)return[];
  const parent=WBS[i];const kids=[];
  for(let j=i+1;j<WBS.length;j++){
    if(WBS[j].projId!==parent.projId)break;
    if(WBS[j].lv<=parent.lv)break;            // 같거나 상위 레벨 → 형제/상위, 종료
    if(WBS[j].lv===parent.lv+1)kids.push(WBS[j]); // 직계 자식만
  }
  return kids;
}
// 후손(모든 하위 레벨) 전체의 일정 범위 (min 시작 ~ max 종료) — 대단락 간트 막대용
function wRange(id){
  const i=WBS.findIndex(w=>w.id===id);
  if(i<0)return null;
  const parent=WBS[i];const ss=[],ee=[];
  for(let j=i+1;j<WBS.length;j++){
    if(WBS[j].projId!==parent.projId)break;
    if(WBS[j].lv<=parent.lv)break;     // 형제/상위 도달 → 종료
    if(WBS[j].s)ss.push(WBS[j].s);
    if(WBS[j].e)ee.push(WBS[j].e);
  }
  if(!ss.length||!ee.length)return null;
  return{s:ss.sort()[0], e:ee.sort().slice(-1)[0]};
}
function wCS(w){
  // 하위 행이 있는 행은 언제나 하위 진도율의 평균(롤업). 수동 진도율(pctManual)은 말단 행에만 쓴다.
  //   (원본 v28.4.41 버그: 상위 행에 pctManual 이 남으면 하위를 아무리 고쳐도 상위 %가 얼어붙었다)
  if(hasC(w.id)){
    const kids=childW(w.id);
    if(kids.length){
      const pct=Math.round(kids.reduce((a,k)=>a+wCS(k).pct,0)/kids.length);   // 재귀 — 손자까지 집계
      let st=w.status==="지연"?"지연":(pct===100?"완료":pct>0?"진행중":"미시작");
      // 하위가 모두 0%여도 사용자가 상위를 '진행중'으로 둔 것은 존중 (상태 배지만, 진도율은 롤업값 그대로)
      if(st==="미시작" && w.status==="진행중") st="진행중";
      return{pct,status:st};
    }
  }
  // 말단 행 + 수동 진도율
  if(w.pctManual!=null && w.pctManual!==""){
    const pct=Math.max(0,Math.min(100,Math.round(Number(w.pctManual))||0));
    return{pct,status:w.status||(pct>=100?"완료":pct>0?"진행중":"미시작")};
  }
  // 말단 행: 상태 기준 (완료=100, 미시작=0, 진행중=명시된 pct 또는 시작~완료 경과율)
  const st=w.status||(w.pct===100?"완료":w.pct>0?"진행중":"미시작");
  let pct;
  if(st==="완료")pct=100;
  else if(st==="미시작")pct=0;
  else if(w.pct!=null)pct=w.pct;
  else if(w.s&&w.e){
    const today=new Date(),start=new Date(w.s),end=new Date(w.e);
    if(today<start)pct=0;
    else if(today>=end)pct=99;          // 완료 처리 전까지 99%
    else pct=Math.round((today-start)/(end-start)*100);
    pct=Math.max(1,Math.min(99,pct));   // 진행중은 1~99%
  }
  else pct=0;
  return{pct,status:st};
}
function wVis(){
  const res=[];
  // v28.4: 현재 선택된 프로젝트의 WBS만 표시 (projId 필터)
  const curPid=S.selproj?.id||_wbsPid;
  const filtered=WBS.filter(w=>{
    if(!curPid)return false;
    if(w.projId!==curPid)return false;
    return true;
  });
  for(let i=0;i<filtered.length;i++){
    const w=filtered[i];
    // 상위 조상 중 하나라도 접혀 있으면 숨김 (3단계 이상 계층 지원)
    if(w.lv>0){
      let hidden=false, needLv=w.lv-1;
      for(let j=i-1;j>=0&&needLv>=0;j--){
        if(filtered[j].lv===needLv){            // 직계 조상 발견
          if(S.wexp[filtered[j].id]===false){hidden=true;break;}
          needLv--;                              // 다음 상위 조상 찾기
        }
      }
      if(hidden)continue;
    }
    const{status}=wCS(w);if(S.wf!=="전체"&&status!==S.wf)continue;
    res.push(w);
  }
  return res;
}
// ── 대단락 "N", 하위 "N.M" ──
function renumberWBS(){
  // v28.4.34: projId별로 독립적으로 다단계 번호 매김 (3레벨 이상 지원).
  //   lv0 → 1, 2, 3 …   lv1 → N.1, N.2 …   lv2 → N.M.1, N.M.2 …   (레벨 제한 없음)
  //   각 항목은 배열 순서 + lv로 계층이 결정되므로, 레벨별 카운터를 유지하면서
  //   더 얕은 레벨을 만날 때마다 그보다 깊은 카운터를 리셋한다.
  const projIds=new Set(WBS.filter(w=>w.projId).map(w=>w.projId));
  projIds.add(undefined);   // projId 없는 옛 데이터 호환
  projIds.forEach(curPid=>{
    const counters=[];   // counters[lv] = 해당 레벨의 현재 번호
    for(let i=0;i<WBS.length;i++){
      if(WBS[i].projId!==curPid)continue;
      const lv=WBS[i].lv||0;
      counters[lv]=(counters[lv]||0)+1;
      counters.length=lv+1;              // 더 깊은 레벨 카운터 초기화
      const code=counters.map(x=>x||0).join(".");
      WBS[i]={...WBS[i],code};
    }
  });
}
function moveWBS(id,dir){
  // v28.4.39: 다단계(3레벨+) 대응 재작성 — 어떤 레벨이든 자신+하위 서브트리를 통째로,
  // 같은 부모 아래의 "형제 서브트리" 단위로만 위/아래 이동한다.
  // (기존 코드는 lv0만 블록 이동이고 lv>0은 한 줄 교환이라, 하위 묶음을 가진 소단락을
  //  움직이면 자기 한 줄만 옆 형제의 자식들 사이로 파고들어 계층이 깨졌음 —
  //  예: 3.2 ▼ 를 누르면 3.1 의 하위 행 사이로 끼어드는 버그)
  const idx=WBS.findIndex(w=>w.id===id);if(idx===-1)return;
  const item=WBS[idx];const lv=item.lv||0;
  // 서브트리 끝 위치: 자신 바로 뒤부터 더 깊은 레벨이 연속되는 구간의 끝
  const subEnd=i0=>{let j=i0+1;while(j<WBS.length&&WBS[j].projId===WBS[i0].projId&&(WBS[j].lv||0)>(WBS[i0].lv||0))j++;return j;};
  const end=subEnd(idx);
  if(dir===-1){
    // 위로: 직전 형제(같은 lv)의 시작 위치를 찾는다 — 그 형제의 자식들(lv 더 깊음)은 건너뜀.
    let p=idx-1;
    while(p>=0&&WBS[p].projId===item.projId&&(WBS[p].lv||0)>lv)p--;
    if(p<0||WBS[p].projId!==item.projId||(WBS[p].lv||0)!==lv)return;   // 부모/경계 → 더 못 올라감
    const bl=WBS.splice(idx,end-idx);
    WBS.splice(p,0,...bl);
  }else{
    // 아래로: 내 서브트리 바로 다음이 같은 lv 형제여야 하고, 그 형제의 서브트리 끝 뒤로 이동.
    if(end>=WBS.length)return;
    const nxt=WBS[end];
    if(nxt.projId!==item.projId||(nxt.lv||0)!==lv)return;   // 다음이 부모 경계/다른 프로젝트 → 더 못 내려감
    const nxtEnd=subEnd(end);
    const bl=WBS.splice(idx,end-idx);
    WBS.splice(idx+(nxtEnd-end),0,...bl);
  }
  renumberWBS();addLog(`↕ 순서·코드 갱신: ${item.name}`,"info");us({});
}

// ═══════════════════════════════════════════════════════════
// EVMS (획득가치관리 / Earned Value Management) — v28.5
// PV(계획가치) · EV(획득가치) · SV(일정차이) · SPI(일정성과지수) + S-Curve
// 비용(BAC/AC/CPI)은 계약금액 입력 시 환산
// ═══════════════════════════════════════════════════════════
function evmsPlanPct(w,when){ // 대단락 계획 진척%
  let s=w.s,e=w.e;
  if(hasC(w.id)){const r=wRange(w.id); if(r){s=r.s;e=r.e;}}
  if(!s||!e)return null;
  const t=when||(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
  const sd=new Date(s),ed=new Date(e);
  if(t<=sd)return 0; if(t>=ed)return 100;
  return (t-sd)/(ed-sd)*100;
}
function evmsCalc(pid){
  const tops=WBS.filter(w=>w.projId===pid&&w.lv===0);
  let PV=0,EV=0,wsum=0;const rows=[];
  tops.forEach(w=>{
    const wt=(w.weight!=null?w.weight:100/tops.length);
    const ev=wCS(w).pct||0; const pvRaw=evmsPlanPct(w); const pv=pvRaw==null?0:pvRaw;
    PV+=wt*pv; EV+=wt*ev; wsum+=wt;
    rows.push({code:w.code,name:w.name,wt,pv:pvRaw==null?null:Math.round(pvRaw),ev,sv:Math.round(ev-pv),spi:pv>0?+(ev/pv).toFixed(2):null});
  });
  const pvP=wsum?+(PV/wsum).toFixed(1):0, evP=wsum?+(EV/wsum).toFixed(1):0;
  const dated=WBS.filter(w=>w.projId===pid&&w.s&&w.e);
  const sMin=dated.length?dated.map(w=>w.s).slice().sort()[0]:"";
  const eMax=dated.length?dated.map(w=>w.e).slice().sort().slice(-1)[0]:"";
  const curve=[];
  if(sMin&&eMax){
    const ps=new Date(sMin),pe=new Date(eMax);
    let d=new Date(ps.getFullYear(),ps.getMonth(),1);
    while(d<=pe){
      const me=new Date(d.getFullYear(),d.getMonth()+1,0);
      let pv=0,ws=0;
      tops.forEach(w=>{const wt=(w.weight!=null?w.weight:100/tops.length);const p=evmsPlanPct(w,me);pv+=wt*(p==null?0:p);ws+=wt;});
      curve.push({x:+((me-ps)/(pe-ps)*100).toFixed(1),pv:+(pv/ws).toFixed(1),label:(me.getMonth()+1)+"월",date:me.toISOString().slice(0,10)});
      d.setMonth(d.getMonth()+1);
    }
  }
  const today=new Date();today.setHours(0,0,0,0);
  const todayX=(sMin&&eMax)?+(((today-new Date(sMin))/(new Date(eMax)-new Date(sMin)))*100).toFixed(1):-1;
  return {tops,rows,pv:pvP,ev:evP,sv:+(evP-pvP).toFixed(1),spi:pvP>0?+(evP/pvP).toFixed(2):null,curve,todayX,sMin,eMax};
}
function evmsPanel(pid,compact){
  const E=evmsCalc(pid);

    case"opEvmsBac":{const cur=(S.evmsBac&&S.evmsBac[d.pid])||0;const v=prompt("계약금액(BAC)을 원 단위로 입력하세요 (예: 2000000000)",cur||"");if(v!==null){const n=Number(String(v).replace(/[^0-9.]/g,''))||0;us(s=>({...s,evmsBac:{...(s.evmsBac||{}),[d.pid]:n}}));}}break;
    case"tgExp":us(s=>({...s,wexp:{...s.wexp,[d.id]:s.wexp[d.id]===false}}));break;
    case"selW":{const w=WBS.find(x=>x.id===d.id);us({wsel:S.wsel?.id===w?.id?null:w,wedit:false});break;}
    // v30: 간트 막대 클릭 → 메모 콜아웃 토글 / 콜아웃 ✏ → 메모 편집
    case"tgMemoCo":{if(_memoOpen[d.id])delete _memoOpen[d.id];else _memoOpen[d.id]=true;us({});break;} // us() 경유 — 스크롤 위치 유지
    case"opMemoEd":{openMemoEditor(d.id);break;}
    case"clrW":us({wsel:null,wedit:false});break;
    case"delW":{
      const wid=d.id;const wi=WBS.findIndex(x=>x.id===wid);if(wi<0)break;
      const w=WBS[wi];
      // v28.4.33: 하위 항목은 parentId 필드가 아니라 배열 순서+lv로 판단되는 구조(childW()/wRange()와 동일 방식).
      // 예전 코드는 존재하지 않는 x.parentId를 참조해 항상 children.length===0으로 나와, 대단락 삭제 시
      // "하위 N개 포함 삭제" 확인창은 뜨지만 실제로는 소단락이 하나도 안 지워지고 고아로 남는 버그였음.
      const delIds=new Set([wid]);
      for(let j=wi+1;j<WBS.length;j++){
        if(WBS[j].projId!==w.projId)break;
        if(WBS[j].lv<=w.lv)break;
        delIds.add(WBS[j].id);
      }
      const childCount=delIds.size-1;
      const msg=childCount
        ?`"${w.code} ${w.name}" 및 하위 ${childCount}개 항목을 모두 삭제합니다.\n이 작업은 되돌릴 수 없습니다. 계속할까요?`
        :`"${w.code} ${w.name}" 항목을 삭제합니다.\n이 작업은 되돌릴 수 없습니다. 계속할까요?`;
      if(!confirm(msg))break;
      WBS=WBS.filter(x=>!delIds.has(x.id));
      // v29.33: 삭제 후 코드 재부여 — 대단락 4를 지우면 기존 5·6·7이 4·5·6으로 당겨져야 함
      // (이전엔 renumberWBS 호출이 빠져 삭제된 번호가 결번으로 남았음)
      renumberWBS();
      addLog(`🗑 삭제: ${w.code} ${w.name}${childCount?' (하위 '+childCount+'개 포함)':''}`,"warn");
      us({wsel:null,wedit:false});
      break;}
    case"dupW":{
      // v28.4.35: WBS 행 복사 — 선택 행과 그 하위 서브트리 전체를 같은 일정·속성으로 복제해
      // 바로 아래에 삽입. 이름은 "(복사)" 접미를 붙여 구분(사용자가 곧바로 수정). 진행 상태 복사 여부는 아래에서 묻는다.
      const wid=d.id;const wi=WBS.findIndex(x=>x.id===wid);if(wi<0)break;
      const src=WBS[wi];
      // 서브트리 범위(자신 + 더 깊은 레벨 연속) 수집
      const block=[src];
      for(let j=wi+1;j<WBS.length;j++){
        if(WBS[j].projId!==src.projId)break;
        if(WBS[j].lv<=src.lv)break;
        block.push(WBS[j]);
      }
      // 삽입 위치 = 서브트리 끝 바로 다음
      const insAt=wi+block.length;
      const stamp=Date.now();
      // v28.4.38: 진행 상태(진도율·상태)도 같이 복사할지 선택 — 같은 장비를 여러 대 만들 때
      // 진행 상황이 거의 같으면 그대로 복사하는 편이 훨씬 빠름 (사용자 요청).
      const keepProgress=confirm(
        `진행 상태(진도율·상태)도 함께 복사할까요?\n\n`+
        `· [확인] = 원본의 진도율·상태 그대로 복사 (진행된 스케줄 복사)\n`+
        `· [취소] = 미시작 0%로 초기화해서 복사\n\n`+
        `※ 하위 행의 진도율은 항상 하위 평균으로 다시 계산됩니다.`
      );
      const copies=block.map((w0,k)=>{
        // v28.4.41: pctManual 고정은 "자식 없는 말단 행"에만 — 부모 행에 고정하면 이후
        // 자식들의 실제 진행을 바꿔도 부모 막대가 복사 시점 %에 영원히 붙박이가 되는 버그
        // (복사한 행 전부가 같은 %로 보이던 원인). 부모는 자식 롤업으로 자동 계산돼야 한다.
        const isLeaf=!(block[k+1]&&(block[k+1].lv||0)>(w0.lv||0));
        return {
          ...w0,
          id:"w"+stamp+"_"+k,
          name:k===0?`${w0.name} (복사)`:w0.name,   // 최상위만 (복사) 표시, 하위는 이름 그대로
          ...(keepProgress?{}:{status:"미시작",pct:0,pctManual:null}),   // 선택에 따라 진척·상태 초기화
          // 부모 행에 이미 있던 수동 고정값도 복사본에는 물려주지 않는다 (자식 롤업이 진실)
          ...(!isLeaf?{pctManual:null}:{})
        };
      });
      WBS.splice(insAt,0,...copies);
      renumberWBS();
      const newTop=WBS.find(x=>x.id===copies[0].id);
      addLog(`📋 복사: ${src.code} ${src.name}${block.length>1?' (하위 '+(block.length-1)+'개 포함)':''} → ${newTop?newTop.code:''}`,"ok");
      // 복사된 최상위 행을 자동 선택 + 바로 수정 모드로 열어 이름·항목을 곧장 고칠 수 있게
      us({wsel:newTop,wedit:true});
      break;}
    case"stWEdit":us({wedit:true});break;case"clWEdit":us({wedit:false});break;
    case"svWEdit":{
      const id=S.wsel?.id;if(!id)return;
      const cur=S.wsel;
      const q=k=>document.querySelector(`[data-draft="wedit"][data-k="${k}"]`)?.value;
      const name=(q("name")||"").trim()||cur.name,mgr=q("mgr")??cur.mgr,s=q("s")??cur.s,e=q("e")??cur.e;
      let status=q("status")??cur.status;
      const vendor=q("vendor")??cur.vendor??"",memo=q("memo")??cur.memo??"";
      // 수동 진도율 — 비우면 null(자동), 값이 있으면 0~100. 하위 행이 있는 행은 입력 자체를 받지 않는다 (상위는 항상 하위 평균).
      const _pmRaw=q("pctManual");
      let pctManual=(hasC(id)||_pmRaw==null||_pmRaw.trim()==="")?null:Math.max(0,Math.min(100,Math.round(Number(_pmRaw))||0));
      // 진도율만 고치고 상태는 그대로면 상태를 진도율에 맞춘다 (50%인데 '미시작'으로 뜨는 것 방지)
      if(pctManual!=null&&status===cur.status&&status!=="지연")status=pctManual>=100?"완료":pctManual>0?"진행중":"미시작";
      // 상태를 직접 완료/미시작으로 바꿨으면 진도율도 100/0 으로 맞춘다
      if(pctManual!=null&&status!==cur.status&&(status==="완료"||status==="미시작"))pctManual=status==="완료"?100:0;
      WBS=WBS.map(w=>w.id===id?{...w,name,mgr,s,e,status,vendor,memo,pctManual}:w);
      const updated=WBS.find(w=>w.id===id);
      addLog(`✏ 수정됨: ${updated.code} ${updated.name}${pctManual!=null?' [진도율 '+pctManual+'%]':''}${memo?' [메모]':''}${vendor?' ['+vendor+']':''}`,"ok");
      us({wedit:false,wsel:updated});break;}
    case"mvW":moveWBS(d.id,d.dir==="up"?-1:1);break;
    case"opWM":{DRAFT.wform={code:"",name:"",mgr:"",s:"",e:"",status:"미시작",parentId:"",vendor:"",memo:""};us({wmod:true});}break;
    case"clWM":us({wmod:false});break;
    case"svW":{
      const g=k=>document.querySelector(`[data-draft="wform"][data-k="${k}"]`)?.value||"";
      const n=g("name");
      if(!n){us({});break;}
      const pg=g("parentId");
      const curPid=S.selproj?.id||_wbsPid;
      // 다단계(3레벨 이상): 상위 그룹은 어느 레벨이든 고를 수 있다. 새 항목 레벨 = 부모 레벨 + 1, 부모가 없으면 대단락(lv0).
      const parentRow=pg?WBS.find(w=>w.id===pg):null;
      const newRow={id:"w"+Date.now(),code:g("code")||"?",name:n,mgr:g("mgr"),s:g("s"),e:g("e"),status:g("status")||"미시작",lv:parentRow?(parentRow.lv||0)+1:0,projId:curPid,vendor:g("vendor"),memo:g("memo")};
      if(parentRow){
        // 부모의 서브트리 끝(부모보다 얕거나 같은 레벨이 처음 나오는 위치) 바로 앞에 삽입
        let j=WBS.findIndex(w=>w.id===pg)+1;
        while(j<WBS.length&&(WBS[j].lv||0)>(parentRow.lv||0))j++;
        WBS.splice(j,0,newRow);
      }else WBS.push(newRow);
      renumberWBS();
      addLog("WBS 추가: "+n,"ok");
      us({wmod:false});
      break;}
  }
}

let _coDrag=null;
document.addEventListener("mousedown",e=>{
  const hd=e.target.closest("[data-codrag]");

    <div style="display:flex;gap:6px;margin-top:10px">

      <span style="flex:1"></span>
      <button id="wbsMemoCancel" style="padding:6px 12px;background:#f3f4f6;border:none;border-radius:5px;cursor:pointer;font-size:11px">취소</button>
      <button id="wbsMemoSave" style="padding:6px 16px;background:#dc2626;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700">💾 저장</button>

}

function v28WeeklySummary(){
  if(!S.selproj)return"";
  const today=new Date();
  // v28.4.1: 현재 선택된 프로젝트의 WBS만 (projId 필터)
  const curPid=S.selproj.id;
  const items=WBS.filter(w=>w.lv>=0&&w.projId===curPid);
  // 진행 지연: 오늘 > 시작일 && 진척률 50% 미만 && 상태 != 완료
  const delays=items.filter(w=>{
    if(!w.s||!w.e)return false;
    const{pct,status}=wCS(w);
    if(status==="완료")return false;
    const sd=new Date(w.s),ed=new Date(w.e);
    if(today<sd)return false;
    // 계획 진척률 vs 실제 진척률
    const planned=Math.min(100,Math.max(0,(today-sd)/(ed-sd)*100));
    return pct!==null && (planned-pct)>=20;
  }).slice(0,30);
  // 이번주 완료: 종료일이 이번주(월~일)이고 상태 완료
  const wkStart=new Date(today);wkStart.setDate(today.getDate()-((today.getDay()+6)%7));wkStart.setHours(0,0,0,0);
  const wkEnd=new Date(wkStart);wkEnd.setDate(wkStart.getDate()+6);wkEnd.setHours(23,59,59);
  const wkDone=items.filter(w=>{const{status}=wCS(w);if(status!=="완료")return false;if(!w.e)return false;const ed=new Date(w.e);return ed>=wkStart&&ed<=wkEnd;}).slice(0,30);
  // 차주 시작: 시작일이 다음주
  const nxStart=new Date(wkEnd);nxStart.setDate(wkEnd.getDate()+1);nxStart.setHours(0,0,0,0);
  const nxEnd=new Date(nxStart);nxEnd.setDate(nxStart.getDate()+6);nxEnd.setHours(23,59,59);
  const nxStartItems=items.filter(w=>{if(!w.s)return false;const sd=new Date(w.s);return sd>=nxStart&&sd<=nxEnd;}).slice(0,30);
  
  const fmtDate=d=>d.toISOString().slice(0,10);
  const nextMon=new Date(wkEnd);nextMon.setDate(wkEnd.getDate()+1);
  const collapsed=S.weeklyHide!==false; // 기본 접힘 → 간트 공간 확보
  const hdr=`<div class="v28-wsum-hdr" data-a="tgWeekly" style="cursor:pointer">
      <div class="v28-wsum-title">📋 주간 자동 정리${collapsed?` <span style="font-size:10px;color:#6b7280;font-weight:500">(지연 ${delays.length} · 완료 ${wkDone.length} · 차주 ${nxStartItems.length})</span>`:''}</div>
      <div class="v28-wsum-meta">${collapsed?'▶ 펼치기':`생성: ${fmtDate(today)} · 발표: ${fmtDate(nextMon)} 월요회의　▼ 접기`}</div>
    </div>`;
  if(collapsed)return `<div class="v28-wsum" style="flex-shrink:0">${hdr}</div>`;
  return `<div class="v28-wsum" style="flex-shrink:0">
    ${hdr}
    <div class="v28-wsum-grid">
      <div class="v28-wsum-sec">
        <div class="v28-wsum-sec-ttl" style="color:#dc2626">⚠️ 진행 지연 (${delays.length}건)</div>
        <div class="v28-wsum-list">${delays.length===0?'<div class="v28-wsum-em">— 지연 없음 —</div>':delays.map(w=>{const{pct}=wCS(w);return `<div class="v28-wsum-it">• <b>${esc(w.code)}</b> ${esc(w.name.slice(0,18))} — ${pct||0}% (계획 ${Math.round((new Date()-new Date(w.s))/(new Date(w.e)-new Date(w.s))*100)}%)</div>`;}).join("")}</div>
      </div>
      <div class="v28-wsum-sec">
        <div class="v28-wsum-sec-ttl" style="color:#16a34a">✅ 이번주 완료 (${wkDone.length}건)</div>
        <div class="v28-wsum-list">${wkDone.length===0?'<div class="v28-wsum-em">— 없음 —</div>':wkDone.map(w=>`<div class="v28-wsum-it">• <b>${esc(w.code)}</b> ${esc(w.name.slice(0,18))} 100%</div>`).join("")}</div>
      </div>
      <div class="v28-wsum-sec">
        <div class="v28-wsum-sec-ttl" style="color:#3a6bb5">📅 차주 시작 (${nxStartItems.length}건)</div>
        <div class="v28-wsum-list">${nxStartItems.length===0?'<div class="v28-wsum-em">— 없음 —</div>':nxStartItems.map(w=>`<div class="v28-wsum-it">• <b>${esc(w.code)}</b> ${esc(w.name.slice(0,18))} ${esc(w.s.slice(5))}</div>`).join("")}</div>
      </div>
    </div>
  </div>`;
}

// 저장 — 이 브라우저의 localStorage (서버 없음).  백업·PC 간 이동은 「JSON 내보내기/불러오기」.
// ═══════════════════════════════════════════════════════════
const _LS_KEY="wbs_template_v1";
let _wbsPid=null,_wbsRev=0;
let _wbsMasterLoaded=false;   // 불러오기가 끝나기 전엔 저장 금지 — 빈 화면이 기존 데이터를 덮어쓰는 사고 방지
let _previewOnly=false;       // ?sample=1 — 예시를 보기만 하고 저장하지 않는다
let _lastSavedSig=null,_lastRevSig=null,_saveErrShown=false;
// Rev(개정) 판정: 행 구성(추가·삭제)과 시작·완료일이 바뀔 때만 올린다. 진도율·이름·메모 변경은 Rev 유지.
const _revSigOf=rows=>JSON.stringify(rows.map(w=>[w.id,w.s||"",w.e||""]));
// 하위 행이 있는 행은 pctManual 을 갖지 않는다(상위 값이 롤업을 얼리던 v28.4.41 버그) — 저장 때마다 비운다.
function _dropParentManual(){
  for(let i=0;i<WBS.length-1;i++){
    if(WBS[i].pctManual!=null&&WBS[i+1].projId===WBS[i].projId&&(WBS[i+1].lv||0)>(WBS[i].lv||0))WBS[i]={...WBS[i],pctManual:null};
  }
}
function v28Save(){
  if(!_wbsMasterLoaded||_previewOnly||!_wbsPid)return;
  _dropParentManual();
  const data={PROJS,WBS,MITEM,evmsBac:S.evmsBac||{}};
  const sig=JSON.stringify(data);
  if(sig===_lastSavedSig)return;            // 바뀐 것이 없으면 쓰지 않는다
  _lastSavedSig=sig;
  const rs=_revSigOf(WBS);
  if(_lastRevSig!==null&&rs!==_lastRevSig){
    _wbsRev++;addLog(`📌 Rev.${_wbsRev}`,"info");
    const b=document.getElementById("wbsRevBadge");if(b)b.textContent="Rev. "+_wbsRev;
  }
  _lastRevSig=rs;
  try{localStorage.setItem(_LS_KEY,JSON.stringify({...data,rev:_wbsRev,savedAt:Date.now()}));}
  catch(e){
    _lastSavedSig=null;   // 다음 편집 때 다시 시도
    if(!_saveErrShown){_saveErrShown=true;alert("이 브라우저에 저장하지 못했습니다 ("+(e.message||e)+").\n지금 「JSON 내보내기」로 백업해 두세요.");}
  }
}
// R() 호출 시마다 자동 저장 (디바운스 400ms). 탭을 닫기 직전 편집도 놓치지 않게 pagehide 에서 한 번 더.
let v28SaveTimer=null;
const _origR=R;R=function(){_origR.apply(this,arguments);clearTimeout(v28SaveTimer);v28SaveTimer=setTimeout(v28Save,400);};
window.addEventListener("pagehide",()=>{clearTimeout(v28SaveTimer);v28Save();});

// JSON 내보내기 — 파일명 WBS_<프로젝트명>_<날짜>.json
const _fnBase=()=>"WBS_"+(String(S.selproj?.name||"프로젝트").replace(/[\\/:*?"<>|]/g," ").replace(/\s+/g," ").trim()||"프로젝트");
function v28Export(){
  const payload={format:"wbs-template",ver:1,PROJS,WBS,MITEM,rev:_wbsRev,evmsBac:S.evmsBac||{},exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`${_fnBase()}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  addLog("📥 JSON 내보내기 완료","ok");
}

// JSON 불러오기 — 현재 데이터를 파일 내용으로 교체
function v28Import(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept=".json,application/json";
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(!d||!Array.isArray(d.WBS))throw new Error("WBS 일정표 JSON 파일이 아닙니다 (WBS 목록이 없습니다).");
      if(!confirm(`불러오면 현재 데이터가 교체됩니다.\n파일: ${f.name}\n계속하시겠습니까?`))return;
      const projs=(Array.isArray(d.PROJS)&&d.PROJS.length)?d.PROJS:[_newProject(d.WBS[0]&&d.WBS[0].projId)];
      _applyData({PROJS:projs,WBS:d.WBS,MITEM:d.MITEM,rev:d.rev,evmsBac:d.evmsBac});
      addLog("📤 JSON 불러오기 완료: "+f.name,"ok");
      R();
    }catch(err){alert("불러오기 실패: "+err.message);addLog("📤 불러오기 실패","err");}
  };
  inp.click();
}

// act 핸들러 확장 — Export/Import 액션 등록

// v28.4: 버그 수정 + UX 개선 (삭제 / 숨김 / 인쇄)
// ═══════════════════════════════════════════════════════════
const _origAct4=act;
act=function(a,d){
  switch(a){
    case"v284Print":{
      // v28.4.46: 즉시 생성 대신 출력 레벨 선택 모달부터 (대단락만/중단락까지/…)

      us({expChoose:"excel"});

    }
    case"clExport":{us({expChoose:null});return;}
    case"doExport":{
      const _lv=Number(d.lv);const _t=S.expChoose;

      _genBusy=true;
      showGenOverlay(_t==="pdf"
        ?"PDF 생성 중... 간트 이미지를 그리는 중입니다. 큰 스케줄은 10~20초 걸릴 수 있어요."
        :"Excel 생성 중... 잠시만 기다려주세요.");
      setTimeout(async()=>{
        try{ if(_t==="pdf") await v284GeneratePDF(_lv); else await v284GenerateExcel(_lv); }
        catch(err){ alert("생성 중 오류: "+(err.message||err)); }
        finally{ _genBusy=false; hideGenOverlay(); }
      },60);
      return;
    }
    // v28.4.17: NOTE 편집 모달
    case"opNoteEdit":{
      if(!S.selproj){alert("프로젝트를 먼저 선택해주세요.");return;}
      us({noteEditMod:true});return;
    }
    case"clNoteEdit":{us({noteEditMod:false});return;}
    case"svNoteEdit":{
      const ta=document.getElementById('noteEditTA');
      if(!ta||!S.selproj)return;
      const newNote=ta.value.trim();
      PROJS=PROJS.map(p=>p.id===S.selproj.id?{...p,customNote:newNote}:p);
      const updated=PROJS.find(p=>p.id===S.selproj.id);
      addLog(`📝 NOTE 저장: ${updated.no} (${newNote.length} 자)`,"ok");
      us({noteEditMod:false,selproj:updated});return;
    }
    case"resetNote":{
      if(!S.selproj)return;
      if(!confirm("NOTE를 기본값으로 초기화하시겠습니까?"))return;
      PROJS=PROJS.map(p=>p.id===S.selproj.id?{...p,customNote:""}:p);
      const updated=PROJS.find(p=>p.id===S.selproj.id);
      addLog(`🔄 NOTE 기본값 복원: ${updated.no}`,"info");
      us({noteEditMod:false,selproj:updated});return;
    }
  }
  return _origAct4.apply(this,arguments);
};

// ═══════════════════════════════════════════════════════════
// v28.4.17: WBS 일정표 Excel 생성 (단순화 - 병합 최소화)
// xlsx-js-style 사용 — 셀 색상 + 테두리 + 안정성 우선
// ═══════════════════════════════════════════════════════════
async function v284GenerateExcel(maxLv){
  if(!S.selproj){alert("프로젝트가 선택되지 않았습니다.");return;}
  const proj=S.selproj;
  // v28.4.46: 출력 레벨 제한 — 대단락만(0)/중단락까지(1)/소단락까지(2)/전체(99).
  //   상위 진도율은 wCS()가 전역 WBS로 롤업하므로 하위를 출력에서 빼도 %는 정확.
  const _mx=(maxLv==null||isNaN(maxLv))?99:Number(maxLv);
  const projWBS=WBS.filter(w=>w.projId===proj.id&&(w.lv||0)<=_mx);
  if(projWBS.length===0){alert("이 프로젝트에 WBS 항목이 없습니다.");return;}
  if(typeof XLSX==="undefined"){alert("Excel 라이브러리 로딩 중입니다.");return;}
  
  addLog(`📊 Excel 생성 시작: ${proj.no}`,"info");
  
  try{
    const dates=projWBS.filter(w=>w.s&&w.e).map(w=>[new Date(w.s),new Date(w.e)]);
    const minDate=dates.length?new Date(Math.min(...dates.map(d=>d[0]))):new Date();
    const maxDate=dates.length?new Date(Math.max(...dates.map(d=>d[1]))):new Date();
    const months=[];
    const cursor=new Date(minDate.getFullYear(),minDate.getMonth(),1);
    const endCursor=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);
    while(cursor<=endCursor){months.push({y:cursor.getFullYear(),m:cursor.getMonth()+1});cursor.setMonth(cursor.getMonth()+1);}
    const dayDivisions=[4,8,12,16,20,24,28,31];
    // v28.4.30: 월말일을 행마다(월수×8회씩) 재계산하지 않도록 한 번만 계산해 재사용 — 대형 프로젝트 생성속도 개선
    const monthLastDay=months.map(mo=>new Date(mo.y,mo.m,0).getDate());
    const today=new Date();today.setHours(0,0,0,0);
    
    const fontKR=(opts={})=>({name:"맑은 고딕",sz:9,...opts});
    const center={horizontal:"center",vertical:"center",wrapText:true};
    const left={horizontal:"left",vertical:"center",wrapText:true};
    const thinB={style:"thin",color:{rgb:"888888"}};
    const mediumB={style:"medium",color:{rgb:"1A1A1A"}};
    const thickB={style:"thick",color:{rgb:"1A1A1A"}};
    const border={top:thinB,bottom:thinB,left:thinB,right:thinB};
    // v28.4.17: 외곽 강한 테두리용 헬퍼
    const borderWith=(opts={})=>({
      top:opts.top||thinB,
      bottom:opts.bottom||thinB,
      left:opts.left||thinB,
      right:opts.right||thinB
    });
    const grayFill={patternType:"solid",fgColor:{rgb:"F0F0F0"}};
    const blueFill={patternType:"solid",fgColor:{rgb:"3A7BC9"}};
    const lightBlueFill={patternType:"solid",fgColor:{rgb:"CFDCEF"}};
    const yellowFill={patternType:"solid",fgColor:{rgb:"FFF3CD"}};
    
    // ─── 컬럼 구조 (단순화: 병합 없는 DESCRIPTION) ───
    const C_NO=0,C_DESC=1,C_START=2,C_FIN=3,C_PCT=4;
    const C_MONTH_START=5;
    const C_REMARK=C_MONTH_START+months.length*8;
    const C_MEMO=C_REMARK+1;
    const totalCols=C_MEMO+1;

    // v28.4.31: 특정 날짜가 속한 일자분할 칸의 컬럼 인덱스와 그 칸 안에서의 위치(0~1)를 계산.
    // 오늘선(todayColInfo)뿐 아니라 EVMS 곡선 도형(v28.4.32)도 이 함수로 각 점의 위치를 구함.
    function dateColFrac(dateObj){
      let result=null;
      months.forEach((mo,mi)=>{
        const lastDay=monthLastDay[mi];
        dayDivisions.forEach((d,di)=>{
          const dEnd=Math.min(d,lastDay);
          const dStart=Math.min((di===0?1:dayDivisions[di-1]+1),lastDay);
          const cellStart=new Date(mo.y,mo.m-1,dStart);cellStart.setHours(0,0,0,0);
          const cellEnd=new Date(mo.y,mo.m-1,dEnd);cellEnd.setHours(23,59,59,999);
          if(cellStart<=dateObj&&dateObj<=cellEnd){
            const span=cellEnd-cellStart;
            result={col:C_MONTH_START+mi*8+di, frac: span>0?(dateObj-cellStart)/span:0};
          }
        });
      });
      return result;
    }
    // 그리드 전체 폭(일자분할 칸 개수) 기준 0~1 정규화 X 좌표. 범위 밖 날짜는 0 또는 1로 clamp.
    function dateNormX(dateObj){
      const cf=dateColFrac(dateObj);
      if(cf) return ((cf.col-C_MONTH_START)+cf.frac)/(months.length*8);
      const firstDay=new Date(months[0].y,months[0].m-1,1);
      return dateObj<firstDay?0:1;
    }
    const todayColInfo=dateColFrac(today);

    const aoa=[];
    const styles={};
    const merges=[];
    
    // R1: 타이틀 — v28.4.29 ★ 1+2행 통째 병합 시 좌상단(A1)에 텍스트 + A1 스타일 적용
    const r1=[];r1[0]="WBS 일정표";
    aoa.push(r1);
    styles["A1"]={font:fontKR({sz:24,bold:true,color:{rgb:"1A1A1A"}}),alignment:center};
    
    // R2: 빈 행 (1+2행 병합되어 A1이 보임)
    aoa.push([]);
    
    // 1행+2행 통째 세로*가로 병합 (단일 큰 영역)
    merges.push({s:{r:0,c:0},e:{r:1,c:totalCols-1}});
    
    // R3: CLIENT — v28.4.28 ② 진짜 빈 셀 (Array(N).fill("") 금지!) + ③ 우측은 마지막 컬럼
    // 핵심: 배열 인덱스로 sparse array 만들기 - 값 없는 셀은 진짜 비어있음
    const rightInfoCol=totalCols-1;  // ③ CY (마지막 컬럼)
    const r3=[];
    r3[0]=`CLIENT : ${proj.client||"-"}`;
    r3[rightInfoCol]=`PM : ${proj.pm||"-"}`;
    aoa.push(r3);
    styles["A3"]={font:fontKR({bold:true,sz:10})};
    styles[XLSX.utils.encode_cell({r:2,c:rightInfoCol})]={font:fontKR({bold:true,sz:10}),alignment:{horizontal:"right"}};
    
    // R4: PROJECT
    const r4=[];
    r4[0]=`PROJECT : ${proj.name}`;
    r4[rightInfoCol]=`Project No. : ${proj.no}`;
    aoa.push(r4);
    styles["A4"]={font:fontKR({bold:true,sz:11})};
    styles[XLSX.utils.encode_cell({r:3,c:rightInfoCol})]={font:fontKR({bold:true,sz:10}),alignment:{horizontal:"right"}};
    
    // R5: DATE / 작성 / 공기
    const r5=[];
    const todayKr=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\.\s/g,'.').replace(/\.$/,'');
    r5[0]=`DATE : ${todayKr} (REV. ${_wbsRev||0})`;
    const finishDate=projWBS.filter(w=>w.e).map(w=>w.e).sort().reverse()[0]||"";
    r5[rightInfoCol]=`CONSTRUCTION PERIOD : ~ ${finishDate}`;
    aoa.push(r5);
    styles["A5"]={font:fontKR({bold:true,sz:10})};
    styles[XLSX.utils.encode_cell({r:4,c:rightInfoCol})]={font:fontKR({bold:true,sz:10}),alignment:{horizontal:"right"}};
    
    aoa.push([]);  // R6 빈
    
    // R7: 컬럼 헤더
    const r7=Array(totalCols).fill("");
    r7[C_NO]="NO";r7[C_DESC]="DESCRIPTION";r7[C_START]="START";r7[C_FIN]="FINISH";r7[C_PCT]="진척률";
    months.forEach((mo,mi)=>{r7[C_MONTH_START+mi*8]=`${mo.y}년 ${String(mo.m).padStart(2,'0')}월`;});
    r7[C_REMARK]="REMARK";r7[C_MEMO]="메모";
    aoa.push(r7);
    
    // R8: 일자 헤더 — 마지막 칸은 해당 월의 실제 마지막일(28/29/30/31)로 표시
    const r8=Array(totalCols).fill("");
    months.forEach((mo,mi)=>{
      const lastDay=monthLastDay[mi];
      dayDivisions.forEach((d,di)=>{r8[C_MONTH_START+mi*8+di]=Math.min(d,lastDay);});
    });
    aoa.push(r8);
    
    // 헤더 스타일 — v28.4.17: 위/아래 medium 외곽
    const hdrTopBorder={top:mediumB,bottom:mediumB,left:thinB,right:thinB};
    const hdrTopLeftBorder={top:mediumB,bottom:mediumB,left:mediumB,right:thinB};
    const hdrTopRightBorder={top:mediumB,bottom:mediumB,left:thinB,right:mediumB};
    const hdrStyle={font:fontKR({bold:true}),alignment:center,fill:grayFill,border:hdrTopBorder};
    // C_NO은 좌측 외곽, C_MEMO는 우측 외곽
    styles[XLSX.utils.encode_cell({r:6,c:C_NO})]={...hdrStyle,border:hdrTopLeftBorder};

        if(todayInRange){
          const evPath=`<a:path w="100000" h="100000"><a:moveTo>${toPt(dateNormX(new Date(_ExCurve.sMin)),0)}</a:moveTo><a:lnTo>${toPt(dateNormX(today),_ExCurve.ev)}</a:lnTo></a:path>`;
          curveShapesXml+=curveShape(4,'EVMS_EV_Curve','16A34A',evPath);
        }
      }
    }catch(e){console.warn('[WBS] EVMS 곡선 도형 생성 실패:',e);}

    let wroteWithLine=false;
    if((todayColInfo||curveShapesXml) && typeof JSZip!=="undefined"){
      try{
        const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
        const zip=await JSZip.loadAsync(buf);
        const wchToPx=wch=>Math.floor(wch*7+6);
        const EMU_PER_PX=9525;
        let todayLineXml='';
        if(todayColInfo){
          const colPx=wchToPx(colWidths[todayColInfo.col].wch);
          const colOffEmu=Math.max(0,Math.min(colPx-2,Math.round(todayColInfo.frac*colPx)))*EMU_PER_PX;
          const lineWidthEmu=2*EMU_PER_PX;
          todayLineXml=`<xdr:twoCellAnchor editAs="absolute">
<xdr:from><xdr:col>${todayColInfo.col}</xdr:col><xdr:colOff>${colOffEmu}</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from>
<xdr:to><xdr:col>${todayColInfo.col}</xdr:col><xdr:colOff>${colOffEmu+lineWidthEmu}</xdr:colOff><xdr:row>${totalRows}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>
<xdr:sp macro="" textlink="">
<xdr:nvSpPr><xdr:cNvPr id="2" name="TodayLine"/><xdr:cNvSpPr/></xdr:nvSpPr>
<xdr:spPr>
<a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></a:xfrm>
<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
<a:solidFill><a:srgbClr val="DC2626"/></a:solidFill>
<a:ln><a:noFill/></a:ln>
</xdr:spPr>
<xdr:txBody><a:bodyPr/><a:lstStyle/><a:p/></xdr:txBody>
</xdr:sp>
<xdr:clientData/>
</xdr:twoCellAnchor>`;
        }
        const drawingXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
${todayLineXml}${curveShapesXml}
</xdr:wsDr>`;
        zip.file('xl/drawings/drawing1.xml',drawingXml);
        zip.file('xl/worksheets/_rels/sheet1.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>`);
        let ct=await zip.file('[Content_Types].xml').async('string');
        ct=ct.replace('</Types>','<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>');
        zip.file('[Content_Types].xml',ct);
        let sheetXml=await zip.file('xl/worksheets/sheet1.xml').async('string');
        sheetXml=sheetXml.replace('</worksheet>','<drawing r:id="rId1"/></worksheet>');
        zip.file('xl/worksheets/sheet1.xml',sheetXml);
        const outBlob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        const a=document.createElement('a');
        const url=URL.createObjectURL(outBlob);
        a.href=url;a.download=fileName;document.body.appendChild(a);a.click();
        setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
        wroteWithLine=true;
      }catch(e){
        console.warn('[WBS] 오늘선 도형 삽입 실패, 기본 방식으로 저장:',e);
      }
    }
    if(!wroteWithLine) XLSX.writeFile(wb,fileName);

    addLog(`✅ Excel 다운로드 완료: ${fileName}`,"ok");
  }catch(e){
    console.error("Excel 생성 오류:",e);
    alert("Excel 생성 중 오류:\n"+(e.message||""));
    addLog(`❌ Excel 실패: ${e.message}`,"err");
  }
}

// PDF 생성 — html2canvas + jsPDF (A3 가로)
async function v284GeneratePDF(maxLv){
  if(!S.selproj){alert("프로젝트가 선택되지 않았습니다.");return;}
  
  const proj=S.selproj;
  // v28.4.46: 출력 레벨 제한 (Excel과 동일)
  const _mx=(maxLv==null||isNaN(maxLv))?99:Number(maxLv);
  const projWBS=WBS.filter(w=>w.projId===proj.id&&(w.lv||0)<=_mx);
  if(projWBS.length===0){alert("이 프로젝트에 WBS 항목이 없습니다.");return;}
  
  if(typeof window.jspdf==="undefined"||typeof window.html2canvas==="undefined"){
    alert("PDF 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.\n(인터넷 연결을 확인하세요)");
    return;
  }
  
  addLog(`📄 PDF 생성 시작: ${proj.no}`,"info");
  
  // 임시 PDF 컨테이너 생성 (오프스크린)
  const pdfContainer=document.createElement('div');
  pdfContainer.id='v284-pdf-container';
  pdfContainer.style.cssText='position:absolute;left:-9999px;top:0;width:1600px;background:#fff;padding:0;font-family:"Malgun Gothic","맑은 고딕",sans-serif';
  
  // 일정 범위 계산
  const dates=projWBS.filter(w=>w.s&&w.e).map(w=>[new Date(w.s),new Date(w.e)]);
  const allStarts=dates.map(d=>d[0]);
  const allEnds=dates.map(d=>d[1]);
  const minDate=allStarts.length?new Date(Math.min(...allStarts)):new Date();
  const maxDate=allEnds.length?new Date(Math.max(...allEnds)):new Date();
  
  // 월 단위 헤더 (회사 양식은 월별로 4·8·12·16·20·24·28·31 8칸씩)
  const months=[];
  const cursor=new Date(minDate.getFullYear(),minDate.getMonth(),1);
  const endCursor=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);
  while(cursor<=endCursor){
    months.push({y:cursor.getFullYear(),m:cursor.getMonth()+1});
    cursor.setMonth(cursor.getMonth()+1);
  }
  
  // 회사 양식: 월별로 8개 일자 컬럼 (4, 8, 12, 16, 20, 24, 28, 31/30/28...)
  // v28.4.25 ★ 라벨만 동적 - 좌표계는 v28.4.22 방식 유지 (헤더 8칸 균등 + dayPos는 5/4~12/31 기준)
  function getMonthLastDay(y,m){return new Date(y,m,0).getDate();}
  
  // v28.4.30 ★ 헤더/그리드는 "월마다 8칸 균등폭"인데 예전 dayPos()는 실제 경과일수 기준이라
  // 두 좌표계가 어긋나서(30일짜리 달이 껴있을수록 밀림) 오늘선·막대가 그리드와 안 맞는 버그가 있었음.
  // → dayPos()도 동일하게 "월 8칸 그리드" 좌표계로 계산해 완전히 일치시킴.
  const monthIndexOf=(y,m)=>months.findIndex(mo=>mo.y===y&&mo.m===m);
  const dayPos=d=>{
    const dt=new Date(d);
    const y=dt.getFullYear(),m=dt.getMonth()+1,day=dt.getDate();
    const mi=monthIndexOf(y,m);
    if(mi<0){
      const beforeRange=new Date(y,m-1,day)<new Date(months[0].y,months[0].m-1,1);
      return beforeRange?0:100;
    }
    const lastDay=getMonthLastDay(y,m);
    const edges=[0,4,8,12,16,20,24,28,lastDay];
    let i=0;while(i<edges.length-1&&day>edges[i+1])i++;
    const lo=edges[i],hi=edges[i+1];
    const frac=hi>lo?(day-lo)/(hi-lo):0;
    const posWithinMonth=(i+frac)/8;
    return Math.max(0,Math.min(100,(mi+posWithinMonth)/months.length*100));
  };

  // 오늘 위치
  const today=new Date();today.setHours(0,0,0,0);
  const _rangeStartM=months[0],_rangeEndM=months[months.length-1];
  const rangeStart=new Date(_rangeStartM.y,_rangeStartM.m-1,1);
  const rangeEnd=new Date(_rangeEndM.y,_rangeEndM.m-1,getMonthLastDay(_rangeEndM.y,_rangeEndM.m),23,59,59,999);
  const todayPos=(today>=rangeStart&&today<=rangeEnd)?dayPos(today):-1;

  // ═══ EVMS S-Curve (PDF: canvas로 직접 묘화 — 선 굵기 정확, 왜곡 없음) ═══
  let _pvArr=[], _evArr=[];
  try{
    const _Ep=evmsCalc(proj.id);
    const _sMinP=projWBS.filter(w=>w.s).map(w=>w.s).sort()[0]||"";
    const _todayP=dayPos(new Date().toISOString().slice(0,10));
    if(_sMinP)_pvArr.push([dayPos(_sMinP),0]);
    _Ep.curve.forEach(p=>_pvArr.push([dayPos(p.date),p.pv]));
    _evArr=[[_sMinP?dayPos(_sMinP):0,0],[_todayP,_Ep.ev]];
  }catch(e){console.warn('EVMS PDF curve skip',e);}
  
  // 헤더 정보
  const todayStr=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\.\s/g,'.').replace(/\.$/,'');
  const periodStr=projWBS.length>0?`${projWBS.filter(w=>w.s).map(w=>w.s).sort()[0]||""} ~ ${projWBS.filter(w=>w.e).map(w=>w.e).sort().reverse()[0]||""}`:"";
  const finishDate=projWBS.filter(w=>w.e).map(w=>w.e).sort().reverse()[0]||"";
  
  // WBS 행 HTML — 회사 양식 그대로 (대단락 흰배경/굵음 + 소단락 흰배경 + 들여쓰기 "-")
  // v28.4.5: 행 단위 빨간선 제거 → 전체 SVG로 EVMS 곡선 그림
  // 각 행의 진척 X 위치 계산 (막대 시작점 + 막대길이 × 진척률)
  const rowHeight=30;
  const evmsPoints=[];  // [{x: 진척%위치, y: 행 인덱스}] EVMS S곡선 그리기용
  // v28.4.30: 격자선은 모든 행에서 동일한 X 위치라 행마다 반복 생성할 필요가 없음.
  // 예전엔 행마다 (월수×8)개씩 그려서 대형 프로젝트는 격자선만 수천 개 DOM이 생겨 html2canvas가 느려졌음.
  // → 표 전체 높이를 덮는 오버레이 하나로 한 번만 그림 (idx===0 행에 배치, overflow:visible로 아래까지 노출).
  const gridlinesHTML=months.map((mo,mIdx)=>[4,8,12,16,20,24,28,31].map((d,dIdx)=>`<div style="position:absolute;left:${((mIdx*8+dIdx+1)/(months.length*8))*100}%;top:0;bottom:0;width:1px;background:#e8e8e8"></div>`).join('')).join('');

  const wbsRowsHTML=projWBS.map((w,idx)=>{
    const isMain=w.lv===0;
    const{pct,status}=wCS(w);
    const fillPct=pct==null?0:pct;
    const left=w.s?dayPos(w.s):0;
    const width=(w.s&&w.e)?dayPos(w.e)-left:5;
    
    // v28.4.5: EVMS 곡선용 — 막대 위에서 진척률 위치 (% 좌표)
    // 막대가 없으면 점도 없음
    const hasBar=w.s&&w.e;
    if(hasBar){
      const progressX=left+(width*fillPct/100);
      evmsPoints.push({x:progressX,y:idx,fillPct,plannedPct:0,actualPct:fillPct});
    }
    
    // 회사 양식 막대 색: 단일 파랑 (#3a7bc9)
    const barColor='#3a7bc9';
    const barBg='#cfdcef';
    
    const noText=isMain?(w.code||(idx+1)):'';
    const descText=isMain?w.name:(w.lv===1?`${w.code} ${w.name}`:`- ${w.name}`);
    const descStyle=w.lv===0
      ?'font-size:9pt;font-weight:700;color:#1a1a1a;padding-left:6px'
      :w.lv===1
        ?'font-size:8.5pt;font-weight:700;color:#1a1a1a;padding-left:20px'
        :'font-size:8pt;font-weight:400;color:#333;padding-left:38px';
    
    const endLabel=w.e?`~${w.e.slice(5).replace('-','/')}`:'';
    
    return `<tr style="height:${rowHeight}px" data-idx="${idx}">
      <td style="border:1px solid #888;padding:0;text-align:center;font-size:9pt;font-weight:700;color:#1a1a1a;background:#fff;width:36px">${esc(noText)}</td>
      <td style="border:1px solid #888;padding:3px 0;background:#fff;width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="${descStyle}">${esc(descText)}</span></td>
      <td style="border:1px solid #888;padding:2px 4px;text-align:center;font-size:7.5pt;color:#333;background:#fff;width:68px;white-space:nowrap">${esc(w.s||'')}</td>
      <td style="border:1px solid #888;padding:2px 4px;text-align:center;font-size:7.5pt;color:#333;background:#fff;width:68px;white-space:nowrap">${esc(w.e||'')}</td>
      <td style="border:1px solid #888;padding:2px;text-align:center;font-size:8pt;color:#1a1a1a;background:#fff;width:44px;font-weight:600">${fillPct}%</td>
      <td colspan="${months.length*8}" class="v284-gantt-cell" style="border:1px solid #888;padding:0;position:relative;height:${rowHeight}px;background:#fff${idx===0?';overflow:visible':''}">
        ${idx===0?`<!-- v28.4.30: 격자선/오늘선/TODAY라벨을 표 전체 높이 오버레이로 통합 (행마다 반복 생성 제거 → PDF 생성 속도 개선). 격자선은 막대 뒤(z:1), 오늘선/라벨은 막대 위(z:5)로 분리해 기존 겹침 순서 유지 -->
        <div style="position:absolute;top:0;left:0;width:100%;height:${projWBS.length*rowHeight}px;z-index:1;pointer-events:none">${gridlinesHTML}</div>
        ${todayPos>=0?`<div style="position:absolute;top:0;left:0;width:100%;height:${projWBS.length*rowHeight}px;z-index:5;pointer-events:none">
          <div style="position:absolute;left:${todayPos}%;top:-40px;bottom:0;width:2px;background:#dc2626;margin-left:-1px"></div>
          <div style="position:absolute;left:${todayPos}%;top:-56px;font-size:8pt;font-weight:700;color:#dc2626;z-index:21;white-space:nowrap">
            <div style="position:relative">
              <span style="position:absolute;left:0;top:0;transform:translateX(-50%);font-size:10pt;line-height:1">▼</span>
              <span style="position:absolute;left:0;top:-10px;transform:translateX(-50%);background:#fff;padding:0 4px;border:1px solid #dc2626;border-radius:3px;font-size:7.5pt">TODAY ${todayStr}</span>
            </div>
          </div>
        </div>`:''}`:''}
        ${idx===0&&_pvArr.length?`<canvas id="evms-scurve-cv" style="position:absolute;top:0;left:0;width:100%;height:${projWBS.length*rowHeight}px;z-index:4;pointer-events:none"></canvas>`:''}
        <div class="v284-bar-outer" data-idx="${idx}" data-fillpct="${fillPct}" style="position:absolute;left:${left}%;top:6px;width:${Math.max(width,0.9)}%;height:12px;background:${barBg};border:1px solid ${barColor};box-sizing:border-box;z-index:2">
          <div class="v284-bar-fill" style="position:absolute;left:0;top:0;width:${fillPct}%;height:100%;background:${barColor}"></div>
        </div>
        ${isMain&&w.e?`<div style="position:absolute;left:calc(${left+width}% - 6px);top:3px;width:12px;height:18px;display:flex;align-items:center;justify-content:center;color:#dc2626;font-size:14px;font-weight:700;z-index:6" title="마일스톤">◆</div>`:''}
        <span style="position:absolute;left:calc(${left+width}% + 9px);top:5px;font-size:7pt;color:#1a1a1a;white-space:nowrap;font-weight:600;background:#fff;padding:0 2px;z-index:3">${esc(endLabel)}</span>
        ${w.memo?`<div style="position:absolute;left:calc(${left+width/2}% - 70px);top:-14px;font-size:6.5pt;color:#1e40af;background:#eff6ff;border:1px solid #93c5fd;border-radius:2px;padding:1px 4px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;z-index:7" title="${w.memo.replace(/"/g,'&quot;')}">${esc(w.memo.slice(0,30))}${w.memo.length>30?'…':''}</div>`:''}
      </td>
      <td style="border:1px solid #888;padding:3px 6px;text-align:center;font-size:7.5pt;color:#1a1a1a;background:#fff;width:90px">${w.vendor?`<span style="font-weight:600;color:#1e40af">${esc(w.vendor.slice(0,12))}</span>`:''}</td>
    </tr>`;
  }).join("");
  
  // 회사 양식 100% 재현 HTML
  pdfContainer.innerHTML=`
    <div style="padding:14px 18px;background:#fff;width:1600px;box-sizing:border-box;font-family:'Malgun Gothic','맑은 고딕',sans-serif">
      
      <!-- ─── 회사 양식 헤더 (3단 정렬) ─── -->
      <table style="width:100%;border-collapse:collapse;margin-bottom:10px">
        <tr>
          <td style="vertical-align:top;width:32%;font-size:10pt;color:#1a1a1a;line-height:1.5">
            <div><b>CLIENT</b> : ${esc(proj.client||'-')}</div>
            <div><b>PROJECT</b> : ${esc(proj.name)}</div>
            <div style="font-size:9pt;color:#444"><b>DATE</b> : ${todayStr} (REV. ${esc(_wbsRev||0)})</div>
          </td>
          <td style="vertical-align:top;text-align:center;width:36%">
            <div style="font-size:24pt;font-weight:900;color:#1a1a1a;letter-spacing:2px;font-family:Arial,sans-serif">WBS 일정표</div>
            <div style="height:2px;background:#1a1a1a;margin:2px 60px 0"></div>
          </td>
          <td style="vertical-align:top;text-align:right;width:32%;font-size:10pt;color:#1a1a1a;line-height:1.5">
            <div><b>PM</b> : ${esc(proj.pm||'-')}</div>
            <div style="font-size:9pt;color:#444">${esc(proj.no)}</div>
            <div style="font-size:9pt;color:#444;margin-top:6px"><b>CONSTRUCTION PERIOD</b> : ~ "${esc(finishDate)}"</div>
          </td>
        </tr>
      </table>
      
      <!-- ─── 메인 표 + 오늘 빨간선 (v28.4.17: 각 행 간트셀에 빨간선 + 첫 행에 TODAY 라벨) ─── -->
      <div style="position:relative;margin-top:24px">
        <table id="v284-master-tbl" style="width:100%;border-collapse:collapse;border:1.5px solid #1a1a1a;table-layout:fixed">
          <thead>
            <!-- 1행: 컬럼 헤더 + 월 헤더 -->
            <tr style="height:22px;background:#f0f0f0">
              <th rowspan="2" style="border:1px solid #888;font-size:9pt;font-weight:700;color:#1a1a1a;padding:2px;width:36px">NO</th>
              <th rowspan="2" style="border:1px solid #888;font-size:9pt;font-weight:700;color:#1a1a1a;padding:2px;width:220px">DESCRIPTION</th>
              <th rowspan="2" style="border:1px solid #888;font-size:8pt;font-weight:700;color:#1a1a1a;padding:2px;width:68px">START</th>
              <th rowspan="2" style="border:1px solid #888;font-size:8pt;font-weight:700;color:#1a1a1a;padding:2px;width:68px">FINISH</th>
              <th rowspan="2" style="border:1px solid #888;font-size:8pt;font-weight:700;color:#1a1a1a;padding:2px;width:44px">진척</th>
              ${months.map(mo=>`<th colspan="8" style="border:1px solid #888;font-size:9pt;font-weight:700;color:#1a1a1a;padding:2px;background:#f0f0f0">${mo.y}년 ${String(mo.m).padStart(2,'0')}월</th>`).join('')}
              <th rowspan="2" style="border:1px solid #888;font-size:8pt;font-weight:700;color:#1a1a1a;padding:2px;width:90px">REMARK<br><span style="font-size:6.5pt;color:#666;font-weight:400">담당 업체</span></th>
            </tr>
            <!-- 2행: 일자 헤더 — v28.4.25 균등 8칸 + 마지막 라벨만 월별 실제 마지막일 (30/31/28/29) -->
            <tr style="height:18px;background:#f0f0f0">
              ${months.map(mo=>{
                const lastDay=getMonthLastDay(mo.y,mo.m);
                // 표준 라벨: 4,8,12,16,20,24,28 + 마지막은 lastDay (31/30/28/29)
                const labels=[4,8,12,16,20,24,28,lastDay];
                return labels.map(d=>`<th style="border:1px solid #888;font-size:7pt;font-weight:600;color:#444;padding:1px;min-width:18px">${d}</th>`).join('');
              }).join('')}
            </tr>
          </thead>
          <tbody id="v284-master-tbody">
            ${wbsRowsHTML}
          </tbody>
        </table>
      </div>
      
      <!-- ─── 하단 NOTE (회사 양식 좌측 정렬 텍스트) — v28.4.17: 프로젝트 customNote 우선 ─── -->
      <div style="margin-top:14px">
        <div style="font-size:8.5pt;color:#1a1a1a;line-height:1.6">
          <div style="font-weight:700;margin-bottom:2px">NOTE :</div>
          ${proj.customNote?proj.customNote.split('\n').map(ln=>`<div>${esc(ln.trim().startsWith('*')||ln.trim().startsWith('-')||ln.trim().startsWith('•')?ln:('* '+ln))}</div>`).join(''):`<div>* 본 일정은 ${esc(proj.name)}의 작성 시점 기준 일정이며, 작업 변수에 따라 변경될 수 있다.</div>
          <div>&nbsp;&nbsp;&nbsp;일정 변경 시 관계자와 협의 후 변경한다.</div>`}
          <div style="margin-top:4px;padding-top:4px;border-top:1px dashed #ccc"><b>범례:</b> 빨간 수직선 = 오늘 날짜 · ◆ = 대단락 마일스톤 · 파란 라벨 = 작업 메모 · REMARK = 담당 업체</div>
        </div>
      </div>
      
      <!-- ─── 최하단 작은 푸터 ─── -->
      <div style="margin-top:8px;display:flex;justify-content:space-between;font-size:7pt;color:#888;border-top:1px solid #ccc;padding-top:4px">
        <span>WBS 일정표 템플릿 · © 2026 crazy4eu (cwkim83)</span>
        <span>생성: ${todayStr}</span>
      </div>
    </div>
  `;
  
  document.body.appendChild(pdfContainer);

  // EVMS S-Curve를 canvas에 직접 묘화 (append 후 실제 픽셀 크기 확보 → 선 굵기 정확)
  try{
    const _cv=pdfContainer.querySelector('#evms-scurve-cv');
    if(_cv&&_pvArr.length){
      const W=_cv.offsetWidth||_cv.clientWidth||800, H=_cv.offsetHeight||_cv.clientHeight||600;
      _cv.width=W; _cv.height=H;
      const ctx=_cv.getContext('2d');
      const X=x=>x/100*W, Y=p=>H-(p/100*H);
      const drawLine=(arr,color)=>{ if(arr.length<2)return; ctx.beginPath(); ctx.moveTo(X(arr[0][0]),Y(arr[0][1])); for(let i=1;i<arr.length;i++)ctx.lineTo(X(arr[i][0]),Y(arr[i][1])); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke(); };
      drawLine(_pvArr,'#1d4ed8'); drawLine(_evArr,'#16a34a');
    }
  }catch(e){console.warn('EVMS canvas draw skip',e);}
  
  
  // 한 박자 쉬고 (SVG 렌더링 보장)
  await new Promise(r=>setTimeout(r,50));
  
  try{
    // 캡쳐
    const canvas=await html2canvas(pdfContainer,{
      scale:1.5,
      backgroundColor:'#ffffff',
      logging:false,
      useCORS:true
    });
    
    // jsPDF — A3 가로
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a3'});
    
    const pageWidth=420;
    const pageHeight=297;
    const margin=8;
    const usableWidth=pageWidth-margin*2;
    const usableHeight=pageHeight-margin*2;
    
    const imgWidth=canvas.width;
    const imgHeight=canvas.height;
    
    // v28.4.5: 페이지 분할 — 표 행이 잘리지 않도록 행 단위로 자르기
    // 그러기 위해 행 위치(픽셀)를 사전에 측정해놓음
    let drawWidth=usableWidth;
    let drawHeight=drawWidth*(imgHeight/imgWidth);
    
    if(drawHeight<=usableHeight){
      // 1페이지에 정상 출력
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',margin,margin,drawWidth,drawHeight);
    }else{
      // ─── 여러 페이지 분할 ───
      // 각 페이지에 들어갈 캔버스 픽셀 높이 계산
      const pageImgHeight=Math.floor(usableHeight*(imgWidth/drawWidth));
      
      // v28.4.5: 행 단위 자르기 - tbody 내 각 tr의 위치 측정
      // canvas는 html2canvas scale=1.5라서 픽셀이 1.5배
      const ctnRect=pdfContainer.getBoundingClientRect();
      const tbody=document.getElementById('v284-master-tbody');
      const rows=tbody?tbody.querySelectorAll('tr'):[];
      // 각 행 끝 Y 위치 (캔버스 픽셀 단위)
      const scale=1.5;
      const rowEndsPx=Array.from(rows).map(tr=>{
        const r=tr.getBoundingClientRect();
        return Math.round((r.bottom-ctnRect.top)*scale);
      });
      
      let pageNum=1;
      let sourceY=0;
      
      while(sourceY<imgHeight){
        if(pageNum>1)pdf.addPage();
        
        // 이 페이지 끝 = sourceY + pageImgHeight 까지의 행 중 마지막으로 완전히 들어가는 행의 bottom
        let pageEnd=sourceY+pageImgHeight;
        // 마지막 행보다 더 가면 끝까지
        if(pageEnd>=imgHeight){
          pageEnd=imgHeight;
        }else{
          // 행 안에서 잘리지 않게: sourceY ~ pageEnd 사이에 끝나는 행 중 가장 마지막
          const validRowEnds=rowEndsPx.filter(re=>re>sourceY&&re<=pageEnd);
          if(validRowEnds.length>0){
            pageEnd=validRowEnds[validRowEnds.length-1];
          }
          // 아무 행도 안 들어가면 그냥 자름 (안전장치)
        }
        
        const sliceHeight=pageEnd-sourceY;
        const tempCanvas=document.createElement('canvas');
        tempCanvas.width=imgWidth;
        tempCanvas.height=sliceHeight;
        const ctx=tempCanvas.getContext('2d');
        ctx.fillStyle='#ffffff';
        ctx.fillRect(0,0,tempCanvas.width,tempCanvas.height);
        ctx.drawImage(canvas,0,sourceY,imgWidth,sliceHeight,0,0,imgWidth,sliceHeight);
        
        const pageDrawHeight=(sliceHeight/imgWidth)*usableWidth;
        pdf.addImage(tempCanvas.toDataURL('image/jpeg',0.95),'JPEG',margin,margin,usableWidth,pageDrawHeight);
        pdf.setFontSize(8);pdf.setTextColor(107,114,128);
        pdf.text(`Page ${pageNum}`,pageWidth-margin,pageHeight-3,{align:'right'});
        
        sourceY=pageEnd;
        pageNum++;
        
        // 무한루프 방지
        if(pageNum>50)break;
      }
    }
    
    const todayStrFile=new Date().toISOString().slice(0,10).replace(/-/g,'');
    const _lvSfx=_mx>=99?"":({0:"대단락",1:"중단락까지",2:"소단락까지"}[_mx]||"")+"_";const fileName=`${_fnBase()}_${_lvSfx}${todayStrFile}.pdf`;
    pdf.save(fileName);
    
    addLog(`✅ PDF 생성 완료: ${fileName}`,"ok");
  }catch(e){
    console.error("PDF 생성 오류:",e);
    alert("PDF 생성 중 오류가 발생했습니다.\n"+(e.message||""));
    addLog(`❌ PDF 생성 실패: ${e.message}`,"err");
  }finally{
    if(pdfContainer&&pdfContainer.parentNode){
      pdfContainer.parentNode.removeChild(pdfContainer);
    }
  }
}

(function initLocal(){
